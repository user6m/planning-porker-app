name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  # pull_request(特にclosed = マージ後)イベントのgithub.refは、PRごとの
  # マージ用ref (refs/pull/N/merge) ではなくベースブランチ (refs/heads/main) に
  # 揺れることがあり、その場合mainへのpush(=デプロイ)イベントと同じグループに
  # なってしまう。cancel-in-progressにより、後から届いた方が先行するpushの
  # デプロイ実行を巻き込んでキャンセルしてしまう事故が実際に発生した
  # (PR #12マージ時、closedイベントのrunがデプロイrunをキャンセルしデプロイが
  # スキップされた)。PR番号があればそれをグループキーに使い、push(main)側の
  # グループと完全に分離することで、この事故を防ぐ。
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# publicリポジトリのため最小権限をデフォルトにする。
# フォークからのPRではGitHubが自動的にGITHUB_TOKENを読み取り専用にするが、
# 同一リポジトリ上のpush/PRでも書き込み権限を渡さないよう明示しておく。
permissions:
  contents: read

jobs:
  test:
    name: Typecheck / Lint / Test
    # PRのclose(マージ含む)イベントでは実行不要
    # (マージ前に既にこのジョブがRequired status checkとして通っている)。
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SESSION_SECRET はローカル開発と同じダミー値。
      # `wrangler types` がEnvの型を生成する際と、vitest-pool-workers が
      # テスト実行時にDurable Object/Workers環境へ secret を注入する際に
      # .dev.vars を参照するため、CIでも同じ形式で用意する。
      - name: Create .dev.vars for typegen/test
        run: echo "SESSION_SECRET=dev-only-secret-change-me" > .dev.vars

      - name: Generate Cloudflare Workers types
        run: pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # ブラウザ側バンドル (src/client → dist/) が壊れていないことを PR ごとに確認する。
      # vitest 自体は dist/ が無くても動く (vitest-pool-workers は assets ディレクトリの存在を検証せず、
      # Miniflare は空の一時ディレクトリで起動する) が、Vite 設定や TSX の変換エラーもここで検出する。
      - name: Build client bundle
        run: pnpm build

      - name: Test
        run: pnpm test

  changes:
    name: Detect production-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_deploy: ${{ steps.filter.outputs.docsOnly != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # push前後のdiffを取るため履歴を全取得する。
          fetch-depth: 0

      # 変更ファイルがドキュメント類だけ (docsOnly) なら本番に影響しないためデプロイをスキップする。
      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            docsOnly:
              - '**/*.md'
              - 'docs/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
              - 'LICENSE'

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    # production環境にRequired reviewersを設定すると、ここであなたの
    # 承認待ちになりデプロイが自動実行されなくなる
    # (Settings → Environments → production → Required reviewers)。
    environment: production
    # デプロイ後にCalVerバージョンのリリースPRを作成・自動マージし、タグをpushするため書き込み権限が必要。
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 既存のバージョンタグ (v<year>.<month>.*) を見るためタグ履歴を全取得する。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wrangler deploy は dist/ をそのまま Static Assets としてアップロードするため、
      # 先にブラウザ側バンドルを生成しておく (public/style.css もここで dist/ にコピーされる)。
      # dist/ が無いと wrangler は assets.directory の存在チェックで失敗する。
      - name: Build client bundle
        run: pnpm build

      # 本番の SESSION_SECRET は `wrangler secret put` で別途設定済み。
      # wrangler.jsonc の vars には書かない (書くとデプロイのたびに
      # 平文の値でシークレットが上書きされてしまう)。
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      # デプロイに成功したコミットだけにCalVer (YYYY.MM.MICRO) のバージョンを
      # 付与する。同じ年月に複数回デプロイした場合はMICROを+1し、
      # 月が変わったら0に戻る (scripts/bump-calver.mjs)。
      - name: Bump CalVer version
        id: version
        run: echo "version=$(pnpm --silent version:bump)" >> "$GITHUB_OUTPUT"

      # mainブランチは "PR経由の変更のみ許可" "署名済みコミット必須" という
      # リポジトリルールで保護されているため、package.jsonの更新をmainへ
      # 直接pushすることはできない。そのため、更新用ブランチ(chore/release-vX.Y.Z)を
      # 作ってPRを作成し、GitHub Nativeのauto-merge(squash)に任せる。
      # squashマージでmainに作られるコミットはGitHub自身が作成・署名するため
      # 署名要件を満たし、Required status check ("Typecheck / Lint / Test") も
      # このPR上のCIで満たされる。
      # マージ後のタグ付け・GitHub Release作成は、このPRがマージされた時点で
      # 起動する release-tag ジョブ (pull_request: closed) が行う。
      #
      # そのバージョンをリリース済みかどうかは "vX.Y.Z タグが存在するか" だけで判定する
      # (package.jsonのdiffの有無で判定すると、再シリアライズ時のフォーマット差異などで
      # バージョンが変わっていなくても差分が出てしまう可能性があり脆いため)。
      # 未リリースの場合だけ、package.jsonに差分があればリリースPRを作成する
      # (最初のリリースなどversionが既に一致していて差分が無いケースはタグ付けだけ行う。
      # タグはmainブランチへの変更を伴わないためリポジトリルールの対象外)。
      - name: Open release PR (or tag immediately if no version change)
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet -- package.json; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
            echo "created=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/release-v${VERSION}"
          git checkout -b "$BRANCH"
          git add package.json
          git commit -m "chore: release v${VERSION}"
          git push origin "$BRANCH"

          gh pr create --base main --head "$BRANCH" \
            --title "chore: release v${VERSION}" \
            --body "CalVerバージョン v${VERSION} への自動バンプPRです。マージされるとタグ付け・GitHub Releaseの作成が行われます (release-tag job)。"

          gh pr merge "$BRANCH" --auto --squash --subject "chore: release v${VERSION} [skip ci]"

          echo "created=false" >> "$GITHUB_OUTPUT"

      # 新しくタグを作成できたとき(=バージョン変更なしで即タグ付けした場合)だけ
      # ここでGitHub Releaseを作成する。リリースPR経由の場合は release-tag ジョブが行う。
      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes

  release-tag:
    name: Tag and release after version-bump PR merge
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'chore/release-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Determine version from branch name
        id: version
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "version=${BRANCH#chore/release-v}" >> "$GITHUB_OUTPUT"

      # deployジョブ側で既にタグ付け済み(再実行など)であればスキップする。
      - name: Tag release
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
