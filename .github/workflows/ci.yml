name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# publicリポジトリのため最小権限をデフォルトにする。
# フォークからのPRではGitHubが自動的にGITHUB_TOKENを読み取り専用にするが、
# 同一リポジトリ上のpush/PRでも書き込み権限を渡さないよう明示しておく。
permissions:
  contents: read

jobs:
  test:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # SESSION_SECRET はローカル開発と同じダミー値。
      # `wrangler types` がEnvの型を生成する際と、vitest-pool-workers が
      # テスト実行時にDurable Object/Workers環境へ secret を注入する際に
      # .dev.vars を参照するため、CIでも同じ形式で用意する。
      - name: Create .dev.vars for typegen/test
        run: echo "SESSION_SECRET=dev-only-secret-change-me" > .dev.vars

      - name: Generate Cloudflare Workers types
        run: pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  changes:
    name: Detect production-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_deploy: ${{ steps.filter.outputs.docsOnly != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # push前後のdiffを取るため履歴を全取得する。
          fetch-depth: 0

      # 変更ファイルがドキュメント類だけ (docsOnly) なら本番に影響しないためデプロイをスキップする。
      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            docsOnly:
              - '**/*.md'
              - 'docs/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
              - 'LICENSE'

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    # production環境にRequired reviewersを設定すると、ここであなたの
    # 承認待ちになりデプロイが自動実行されなくなる
    # (Settings → Environments → production → Required reviewers)。
    environment: production
    # デプロイ後にCalVerバージョンをpackage.jsonへコミット＆タグpushするため書き込み権限が必要。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 既存のバージョンタグ (v<year>.<month>.*) を見るためタグ履歴を全取得する。
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 本番の SESSION_SECRET は `wrangler secret put` で別途設定済み。
      # wrangler.jsonc の vars には書かない (書くとデプロイのたびに
      # 平文の値でシークレットが上書きされてしまう)。
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --minify

      # デプロイに成功したコミットだけにCalVer (YYYY.MM.MICRO) のバージョンを
      # 付与する。同じ年月に複数回デプロイした場合はMICROを+1し、
      # 月が変わったら0に戻る (scripts/bump-calver.mjs)。
      - name: Bump CalVer version
        id: version
        run: echo "version=$(pnpm --silent version:bump)" >> "$GITHUB_OUTPUT"

      # [skip ci] を付けることでこのpush自体はCIを再実行しない
      # (GitHub Actionsの標準機能)。
      # package.jsonのversionが既に算出結果と一致している場合 (最初のリリースなど)
      # はコミットする差分が無いため、コミットはスキップしタグ付けだけ行う。
      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore: release v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

          if ! git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi
