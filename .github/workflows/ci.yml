name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# publicリポジトリのため最小権限をデフォルトにする。
# フォークからのPRではGitHubが自動的にGITHUB_TOKENを読み取り専用にするが、
# 同一リポジトリ上のpush/PRでも書き込み権限を渡さないよう明示しておく。
permissions:
  contents: read

jobs:
  test:
    name: Check / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Vite+ (vp) をインストールする。Node.js と、package.json の packageManager に書かれた
      # pnpm のセットアップ、依存関係のキャッシュ (cache: true) もこのアクションが行う。
      # インストールする Vite+ のバージョンは package.json / pnpm-lock.yaml の vite-plus から自動検出される。
      # (v1 のような可変タグは更新が止まっているため、必ず固定バージョンを指定する)
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 22
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # SESSION_SECRET はローカル開発と同じダミー値。
      # `wrangler types` がEnvの型を生成する際と、vitest-pool-workers が
      # テスト実行時にDurable Object/Workers環境へ secret を注入する際に
      # .dev.vars を参照するため、CIでも同じ形式で用意する。
      - name: Create .dev.vars for typegen/test
        run: echo "SESSION_SECRET=dev-only-secret-change-me" > .dev.vars

      - name: Generate Cloudflare Workers types
        run: vp run cf-typegen

      # フォーマット (Oxfmt) / Lint (Oxlint) / 型チェック (tsgolint) をまとめて実行する
      - name: Check (format / lint / typecheck)
        run: vp check

      # tsconfig のプロジェクト参照どおりに TypeScript 本体 (tsc) でも型チェックする
      - name: Typecheck (tsc -b)
        run: vp run typecheck

      # Worker/Durable Object (Workersランタイム上) と React コンポーネント (jsdom) のテスト
      - name: Test
        run: vp test

      # Worker と静的アセット (React SPA) のビルドが通ることを確認する
      - name: Build
        run: vp build

  changes:
    name: Detect production-relevant changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      should_deploy: ${{ steps.filter.outputs.docsOnly != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # push前後のdiffを取るため履歴を全取得する。
          fetch-depth: 0

      # 変更ファイルがドキュメント類だけ (docsOnly) なら本番に影響しないためデプロイをスキップする。
      - name: Check changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            docsOnly:
              - '**/*.md'
              - 'docs/**'
              - '.github/ISSUE_TEMPLATE/**'
              - '.github/dependabot.yml'
              - '.vscode/**'
              - 'LICENSE'

  deploy:
    name: Deploy to Cloudflare Workers
    needs: [test, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    # production環境にRequired reviewersを設定すると、ここであなたの
    # 承認待ちになりデプロイが自動実行されなくなる
    # (Settings → Environments → production → Required reviewers)。
    environment: production
    # デプロイ後にCalVerバージョンをpackage.jsonへコミット＆タグpushするため書き込み権限が必要。
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 既存のバージョンタグ (v<year>.<month>.*) を見るためタグ履歴を全取得する。
          fetch-depth: 0

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version: 22
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # Worker (dist/planning_porker_app) と静的アセット (dist/client) をビルドする。
      # @cloudflare/vite-plugin がデプロイ用の dist/planning_porker_app/wrangler.json と、
      # wrangler コマンドをそこへ向ける .wrangler/deploy/config.json を生成するので、
      # 続く `wrangler deploy` はビルド成果物をそのままデプロイする。
      - name: Build
        run: vp build

      # 本番の SESSION_SECRET は `wrangler secret put` で別途設定済み。
      # wrangler.jsonc の vars には書かない (書くとデプロイのたびに
      # 平文の値でシークレットが上書きされてしまう)。
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # デプロイに成功したコミットだけにCalVer (YYYY.MM.MICRO) のバージョンを
      # 付与する。同じ年月に複数回デプロイした場合はMICROを+1し、
      # 月が変わったら0に戻る (scripts/bump-calver.mjs)。
      - name: Bump CalVer version
        id: version
        run: echo "version=$(node scripts/bump-calver.mjs)" >> "$GITHUB_OUTPUT"

      # [skip ci] を付けることでこのpush自体はCIを再実行しない
      # (GitHub Actionsの標準機能)。
      # そのバージョンをリリース済みかどうかは "vX.Y.Z タグが存在するか" だけで判定する
      # (package.jsonのdiffの有無で判定すると、再シリアライズ時のフォーマット差異などで
      # バージョンが変わっていなくても差分が出てしまう可能性があり脆いため)。
      # 未リリースの場合だけ、package.jsonに差分があればコミットしてタグを打つ
      # (最初のリリースなどversionが既に一致していて差分が無いケースはタグ付けだけ行う)。
      - name: Commit and tag release
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --quiet -- package.json; then
            git add package.json
            git commit -m "chore: release v${VERSION} [skip ci]"
            git push origin HEAD:main
          fi

          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # 新しくタグを作成できたときだけGitHub Releaseを作成する
      # (再実行などでタグが既に存在する場合は重複作成しない)。
      - name: Create GitHub Release
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes
