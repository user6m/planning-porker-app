name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# publicリポジトリのため最小権限をデフォルトにする。
# フォークからのPRではGitHubが自動的にGITHUB_TOKENを読み取り専用にするが、
# 同一リポジトリ上のpush/PRでも書き込み権限を渡さないよう明示しておく。
permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml
